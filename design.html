
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5G Bank ATM Card</title>
    <link rel="stylesheet" href="design.css">
</head>
<body>

    <div class="card">

        <!-- Decorative Circle -->
        <div class="card-circle"></div>

        <!-- Card Header -->
        <div class="card-header">

            <div class="logo-box">5G</div>

            <div class="bank-name">
                <h2>5G BANK</h2>
                <p>VIRTUAL LUXURY</p>
            </div>

            <div class="wifi">
                <svg viewBox="0 0 40 35">
                    <path d="M3 10 Q20 -3 37 10"
                        fill="none" stroke="#f5c85b" stroke-width="3"/>
                    <path d="M9 17 Q20 7 31 17"
                        fill="none" stroke="#f5c85b" stroke-width="3"/>
                    <path d="M15 24 Q20 19 25 24"
                        fill="none" stroke="#f5c85b" stroke-width="3"/>
                    <circle cx="20" cy="30" r="2.5" fill="#f5c85b"/>
                </svg>
            </div>

        </div>

        <!-- Chip -->
        <div class="chip">
            <div class="chip-line vertical"></div>
            <div class="chip-line horizontal"></div>
            <div class="chip-line middle"></div>
        </div>

        <!-- Show Details -->
        <button class="show-details">
            <span>◎</span> Show Details
        </button>

        <!-- Card Number -->
        <div class="card-number">
            <span>••••</span>
            <span>••••</span>
            <span>••••</span>
            <strong>1234</strong>
        </div>

        <!-- Card Information -->
        <div class="card-info">

            <div class="holder">
                <small>CARD HOLDER</small>
                <h3>SARAH M. ADEBAYO</h3>
            </div>

            <div class="validity">
                <div>
                    <small>VALID THRU</small>
                    <h4>10/28</h4>
                </div>

                <div>
                    <small>CVV</small>
                    <h4>•••</h4>
                </div>
            </div>

        </div>

        <!-- Mastercard Logo -->
        <div class="mastercard">
            <div class="master-red"></div>
            <div class="master-yellow"></div>
        </div>

    </div>

</body>
</html>
